version: '3.8'

services:
  # 叶语主应用
  leaftalk-app:
    build: .
    container_name: leaftalk-app
    ports:
      - "80:80"
      - "8893:8893"
    depends_on:
      - mysql
      - redis
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=leaftalk
      - DB_USER=leaftalk
      - DB_PASSWORD=leaftalk123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/var/log/leaftalk
    restart: unless-stopped
    networks:
      - leaftalk-network

  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: leaftalk-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=leaftalk
      - MYSQL_USER=leaftalk
      - MYSQL_PASSWORD=leaftalk123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/FINAL_UNIFIED_SCHEMA.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - leaftalk-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: leaftalk-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - leaftalk-network

  # Nginx 负载均衡器（可选）
  nginx:
    image: nginx:alpine
    container_name: leaftalk-nginx
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - leaftalk-app
    restart: unless-stopped
    networks:
      - leaftalk-network

volumes:
  mysql_data:
  redis_data:

networks:
  leaftalk-network:
    driver: bridge
