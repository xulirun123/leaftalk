<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试通话API</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🧪 通话API测试</h1>
    
    <div>
        <button onclick="testHealth()">测试健康检查</button>
        <button onclick="testCallAPI()">测试通话API</button>
        <button onclick="clearResults()">清空结果</button>
    </div>
    
    <div id="results"></div>

    <script>
        const baseURL = 'http://localhost:8893'
        const resultsDiv = document.getElementById('results')
        
        function addResult(message, isSuccess = true) {
            const div = document.createElement('div')
            div.className = `result ${isSuccess ? 'success' : 'error'}`
            div.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`
            resultsDiv.appendChild(div)
            resultsDiv.scrollTop = resultsDiv.scrollHeight
        }
        
        function clearResults() {
            resultsDiv.innerHTML = ''
        }
        
        async function testHealth() {
            try {
                addResult('🔍 开始测试健康检查API...')
                const response = await fetch(`${baseURL}/health`)
                const data = await response.json()
                addResult(`✅ 健康检查成功: ${JSON.stringify(data)}`)
            } catch (error) {
                addResult(`❌ 健康检查失败: ${error.message}`, false)
            }
        }
        
        async function testCallAPI() {
            try {
                addResult('📞 开始测试通话API...')
                
                const response = await fetch(`${baseURL}/api/call/initiate`, {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer test-token',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        targetUserId: '2',
                        type: 'video'
                    })
                })
                
                if (response.ok) {
                    const data = await response.json()
                    addResult(`✅ 通话API成功: ${JSON.stringify(data)}`)
                } else {
                    const errorData = await response.text()
                    addResult(`❌ 通话API失败 (${response.status}): ${errorData}`, false)
                }
            } catch (error) {
                addResult(`❌ 通话API请求失败: ${error.message}`, false)
            }
        }
        
        // 页面加载时自动测试
        window.onload = function() {
            addResult('🚀 页面加载完成，开始自动测试...')
            testHealth()
            setTimeout(testCallAPI, 1000)
        }
    </script>
</body>
</html>
